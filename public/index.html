<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Anonymous Chat — JOIN · TALK · DISAPPEAR</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="panel">
      <div class="brand">
        <h1>Anonymous Chat</h1>
        <p class="tag">JOIN · TALK · DISAPPEAR</p>
      </div>
      <div class="online">👥 <span id="global-count">0</span> people online</div>
      <div class="controls">
        <button id="btn-create">Create Room</button>
        <button id="btn-join">Join Room</button>
      </div>
      <div class="rooms">
        <h3>Rooms</h3>
        <ul id="room-list"></ul>
      </div>
      <div class="me">
        <div class="avatar" id="my-avatar"></div>
        <div class="me-info">
          <input id="my-name" maxlength="24">
          <button id="btn-change-name">Change</button>
        </div>
      </div>
    </aside>

    <main id="main" class="panel">
      <div id="room-header">
        <h2 id="room-title">Welcome</h2>
        <div id="room-count">0</div>
      </div>
      <div id="messages" class="messages"></div>
      <form id="msg-form" class="msg-form">
        <input id="msg-input" maxlength="1000" autocomplete="off" placeholder="Say something..." />
        <button id="send-btn">Send</button>
      </form>
    </main>

    <aside id="right" class="panel">
      <h3>Members</h3>
      <ul id="member-list"></ul>
      <div class="reports">
        <h4>Actions</h4>
        <button id="btn-report-user">Report User</button>
        <button id="btn-report-msg">Report Message</button>
      </div>
    </aside>
  </div>

  <!-- Modals -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h3 id="modal-title">Modal</h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-close">Close</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
